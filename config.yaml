# ============================================================================
# Fund Accounting NAV & Reconciliation Control Engine - Configuration
# ============================================================================
project:
  name: "Fund Accounting NAV & Reconciliation Control Engine"
  version: "1.0.0"
  as_on: "2026-10-06"          # last business day (T)
  business_days: 30            # look-back window
  currency: "INR"
  country: "IN"
  timezone: "Asia/Calcutta"

funds:
  - fund_code: "ALPHA_EQ"
    fund_name: "Alpha Equity Fund"
    category: "Equity"
    mgmt_fee_bps: 150          # 1.50% p.a.
    opening_nav: 10.0000
    opening_units: 10000000    # 1.00 Crore units
  - fund_code: "BETA_DEBT"
    fund_name: "Beta Debt Fund"
    category: "Debt"
    mgmt_fee_bps: 75           # 0.75% p.a.
    opening_nav: 10.0000
    opening_units: 20000000    # 2.00 Crore units
  - fund_code: "GAMMA_BAL"
    fund_name: "Gamma Balanced Fund"
    category: "Hybrid"
    mgmt_fee_bps: 125          # 1.25% p.a.
    opening_nav: 10.0000
    opening_units: 15000000    # 1.50 Crore units

securities:
  - {symbol: "HDFCBANK",   name: "HDFC Bank Ltd",         sector: "Financials", type: "Equity", base_price: 1650.0, vol: 0.012}
  - {symbol: "ICICIBANK",  name: "ICICI Bank Ltd",        sector: "Financials", type: "Equity", base_price: 1250.0, vol: 0.013}
