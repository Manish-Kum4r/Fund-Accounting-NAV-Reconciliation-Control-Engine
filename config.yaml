recon:
  qty_tolerance_units: 0
  price_tolerance_pct: 0.01      # 0.01% on price
  amount_tolerance_inr: 0.50
  nav_tolerance_pct: 0.05        # 5 bps
  sla_days: 1                    # breaks must be resolved within T+1 business day
  custodian_stmt_date: "2026-10-05"   # T-1 custodian file (realistic ageing)
  bank_stmt_date: "2026-10-06"
  rta_stmt_date: "2026-10-06"

# Deliberate sample breaks (so the control engine demonstrably catches issues)
sample_breaks:
  - {source: "CUSTODIAN", fund: "ALPHA_EQ",  symbol: "HDFCBANK", type: "QTY_BREAK",            qty_delta: 50, price_delta_pct: 0.0, note: "Custodian shows 50 units more - missing sell in books"}
  - {source: "CUSTODIAN", fund: "BETA_DEBT", symbol: "NCD-REL",   type: "MISSING_IN_CUSTODIAN", qty_delta: 0,  price_delta_pct: 0.0, note: "Holding not reported by custodian"}
  - {source: "CUSTODIAN", fund: "GAMMA_BAL", symbol: "MARUTI",    type: "PRICE_BREAK",          qty_delta: 0,  price_delta_pct: 0.5, note: "Custodian price 0.5% off EOD close"}
  - {source: "BANK",      fund: "ALPHA_EQ",  type: "AMOUNT_BREAK", amount_delta: -12500.0, note: "Mgmt fee debit missing in bank statement"}
  - {source: "RTA",       fund: "GAMMA_BAL", date: "2026-09-30", type: "NAV_BREAK", nav_delta_pct: 0.08, note: "Published NAV 8 bps off - carried forward, SLA breach"}

random_seed: 11
