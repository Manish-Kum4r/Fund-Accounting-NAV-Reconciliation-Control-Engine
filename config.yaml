  - {symbol: "CP-TATA",    name: "Tata Motors CP 90D",    sector: "Money Mkt",  type: "Debt",   base_price: 99.8,   vol: 0.001}
  - {symbol: "NCD-REL",    name: "Reliance NCD 9.10%",    sector: "Corporate",  type: "Debt",   base_price: 1005.0, vol: 0.004}

# fund -> securities it may hold (weights sum to 0.95; residual 5% is opening cash)
fund_holdings:
  ALPHA_EQ:  {HDFCBANK: 0.25, ICICIBANK: 0.20, INFY: 0.15, TCS: 0.15, RELIANCE: 0.10, ITC: 0.10}
  BETA_DEBT: {GOI7.26-36: 0.30, GOI8.2-33: 0.25, SDL-MH-32: 0.15, CP-TATA: 0.10, NCD-REL: 0.15}
  GAMMA_BAL: {HDFCBANK: 0.20, INFY: 0.15, LT: 0.10, MARUTI: 0.10, GOI7.26-36: 0.25, SDL-MH-32: 0.15}

investors:
  - {name: "Aarav Sharma",   pan: "AAAPS1234A"}
  - {name: "Priya Nair",     pan: "ABCPN5678B"}
  - {name: "Rahul Mehta",    pan: "ACARM6789C"}
  - {name: "Sneha Iyer",     pan: "ADSIS2345D"}
