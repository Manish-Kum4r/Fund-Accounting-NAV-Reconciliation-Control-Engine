  - {symbol: "TCS",        name: "Tata Consultancy Svcs", sector: "IT",         type: "Equity", base_price: 3600.0, vol: 0.011}
  - {symbol: "RELIANCE",   name: "Reliance Industries",   sector: "Energy",     type: "Equity", base_price: 1350.0, vol: 0.015}
  - {symbol: "ITC",        name: "ITC Ltd",               sector: "FMCG",       type: "Equity", base_price: 480.0,  vol: 0.010}
  - {symbol: "SBIN",       name: "State Bank of India",   sector: "Financials", type: "Equity", base_price: 620.0,  vol: 0.016}
  - {symbol: "LT",         name: "Larsen & Toubro",       sector: "Infra",      type: "Equity", base_price: 2400.0, vol: 0.013}
  - {symbol: "MARUTI",     name: "Maruti Suzuki India",   sector: "Auto",       type: "Equity", base_price: 1800.0, vol: 0.014}
